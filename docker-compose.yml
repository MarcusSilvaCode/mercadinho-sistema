services:
  postgres:
    image: postgres:16-alpine
    container_name: mercadinho_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mercadinho
      POSTGRES_PASSWORD: mercadinho
      POSTGRES_DB: mercadinho
    ports:
      - "5432:5432"
    volumes:
      - mercadinho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mercadinho"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mercadinho_pgdata:
