# Resolve o endereço da API a cada 10s (o IP interno muda a cada deploy da API)
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;

# Usa só a origem (esquema://host:porta) de API_UPSTREAM e repassa o caminho original
map "${API_UPSTREAM}" $api_origin {
  ~^(?<origin>https?://[^/]+) $origin;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass $api_origin$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
